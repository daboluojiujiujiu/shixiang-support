<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾相</title>
  <style>
    :root { --bg:#f6f4ec; --card:#fdfcf7; --ink:#22231f; --muted:#64665f; --accent:#31634a; --line:rgba(0,0,0,.08); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    main { width:min(680px,calc(100% - 36px)); padding:56px 0; }
    article { background:var(--card); border:1px solid var(--line); border-radius:28px; padding:clamp(28px,7vw,56px); text-align:center; box-shadow:0 18px 60px rgba(36,47,39,.07); }
    h1 { margin:0 0 8px; font-size:clamp(38px,9vw,62px); letter-spacing:-.06em; }
    p { color:var(--muted); }
    nav { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:28px; }
    a { padding:11px 18px; border-radius:999px; color:var(--accent); border:1px solid rgba(49,99,74,.2); text-decoration:none; font-weight:600; }
    a:first-child { color:white; background:var(--accent); }
  </style>
</head>
<body>
<main><article>
  <h1>拾相</h1>
  <p>一天一天，把相册拾回来。</p>
  <nav>
    <a href="support.html">技术支持</a>
    <a href="privacy.html">隐私政策</a>
  </nav>
</article></main>
</body>
</html>
